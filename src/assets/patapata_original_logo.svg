<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 186" fill="currentColor">
  <!-- PATA PATA Authentic Original Logo Glyph Definition -->
  <defs>
    <!-- Glyph 'P': Solid silhouette with rounded upper-right bowl -->
    <path id="glyph-p" d="M 0 0 L 52 0 C 78 0 94 14 94 36 C 94 54 80 66 56 66 L 36 66 L 36 100 L 0 100 Z" />
    
    <!-- Glyph 'A': Triangular pyramid with centered diamond counter -->
    <!-- Triangle: (0,100) to (50,0) to (100,100) Z -->
    <!-- Diamond counter: center (50, 62), size 20 (rotated 45 deg) -->
    <path id="glyph-a" fill-rule="evenodd" d="M 50 0 L 102 100 L 0 100 Z M 51 50 L 61 62 L 51 74 L 41 62 Z" />
    
    <!-- Glyph 'T': Solid bold T -->
    <path id="glyph-t" d="M 0 0 L 88 0 L 88 28 L 60 28 L 60 100 L 28 100 L 28 28 L 0 28 Z" />
  </defs>

  <!-- Top Row: P A T A -->
  <g transform="translate(0, 0)">
    <!-- P -->
    <use href="#glyph-p" x="0" y="0" />
    <!-- A -->
    <use href="#glyph-a" x="104" y="0" />
    <!-- T -->
    <use href="#glyph-t" x="218" y="0" />
    <!-- A -->
    <use href="#glyph-a" x="318" y="0" />
  </g>

  <!-- Dual Horizontal Divider Lines -->
  <!-- Top bar below first line -->
  <rect x="0" y="112" width="420" height="8" rx="1" />
  <!-- Bottom bar above second line -->
  <rect x="0" y="128" width="420" height="8" rx="1" />

  <!-- Bottom Row: P A T A -->
  <g transform="translate(0, 148)">
    <!-- P -->
    <use href="#glyph-p" x="0" y="0" />
    <!-- A -->
    <use href="#glyph-a" x="104" y="0" />
    <!-- T -->
    <use href="#glyph-t" x="218" y="0" />
    <!-- A -->
    <use href="#glyph-a" x="318" y="0" />
  </g>
</svg>
